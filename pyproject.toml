[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ChatCDN"
dynamic = ["version"]
description = "ChatArch CDN tooling package."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["click>=8.1,<9.0", "chatstyle>=0.2.0,<0.3.0", "chatenv>=0.2.10,<0.3.0"]
authors = [{name = "ChatArch", email = "rex@chatarch.org"}]
keywords = ["chatcdn", "chatarch", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ChatArch/ChatCDN"
Repository = "https://github.com/ChatArch/ChatCDN"
Documentation = "https://arch.gh.wzhecnu.cn/ChatCDN/"

[project.scripts]
chatcdn = "chatcdn.cli:main"

[project.entry-points."chatenv.configs"]
chatcdn = "chatcdn.config"

[project.optional-dependencies]
dev = ["build", "pytest", "twine"]
docs = ["mkdocs>=1.6,<2.0", "mkdocs-material>=9.5,<10.0", "mkdocs-static-i18n>=1.2,<2.0", "mike>=2.0,<3.0"]

[tool.setuptools.dynamic]
version = {attr = "chatcdn.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true
